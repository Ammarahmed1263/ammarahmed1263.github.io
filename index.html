<title>Ammar Ahmed</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#f2f1ec;
    --surface:#ffffff;
    --ink:#1c1b18;
    --ink-dim:#6b6a63;
    --line:#dedcd2;
    --accent:#d1592f;
    --accent-ink:#8c3517;
    --accent-tint:#f5ddd0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#17140f;
      --surface:#211d17;
      --ink:#f2efe8;
      --ink-dim:#a6a196;
      --line:#3a3428;
      --accent:#e6773f;
      --accent-ink:#f7c7a4;
      --accent-tint:#3a2318;
    }
  }
  :root[data-theme="dark"]{
    --ground:#17140f;
    --surface:#211d17;
    --ink:#f2efe8;
    --ink-dim:#a6a196;
    --line:#3a3428;
    --accent:#e6773f;
    --accent-ink:#f7c7a4;
    --accent-tint:#3a2318;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px;
  }

  .card{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .id{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .badge{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--accent-ink);
    background:var(--accent-tint);
    width:fit-content;
    padding:3px 9px;
    border-radius:3px;
  }
  h1{
    margin:0;
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.02em;
    text-wrap:balance;
  }
  .role{
    color:var(--ink-dim);
    font-size:15px;
    line-height:1.45;
    max-width:34ch;
  }
  .role b{color:var(--ink);font-weight:700;}

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  a.link-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 16px;
    text-decoration:none;
    color:var(--ink);
    transition:border-color .15s ease, transform .15s ease;
  }
  a.link-row:hover{border-color:var(--accent);}
  a.link-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  a.link-row:active{transform:scale(0.98);}

  .glyph{
    width:34px;
    height:34px;
    flex:none;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--accent-tint);
    color:var(--accent-ink);
  }
  .glyph svg{width:18px;height:18px;}

  .link-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .link-label{font-size:14.5px;font-weight:700;}
  .link-handle{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:12.5px;
    color:var(--ink-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .arrow{margin-left:auto;color:var(--ink-dim);flex:none;display:flex;}
  .arrow svg{width:16px;height:16px;}

  footer{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:11.5px;
    color:var(--ink-dim);
    text-align:center;
  }
</style>
